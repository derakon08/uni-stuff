<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Descubra su signo zodiacal</title>

        <link href="brainnumbingstyle.css" type="text/css" rel="stylesheet">
    </head>

    <body>
        <div id="app">
            <h1>Descubra su signo zodiacal</h1>
                <form class="form_list">
                    <p>Ingrese u nombre y fecha de nacimiento a continuacion</p>

                    <br>
                    <input type="text" id="nombre" placeholder="Ingrese su nombre">

                    <br>
                    <input type="date" id="fecha" pattern="\d{2}-\d{2}-\d{4}">

                    <br>
                    <button type="button" id="button" onclick="GetSign()">Aceptar</button>

                    <br>
                </form>
            <p id="display"></p>
        </div>
    </body>

    <script>
        // zodiacojuliano.js
        // Conversion of date string into DD/MM to get the right sign in a whole bunch of if statments
        function GetSign(){ //honestly too lazy to make it into its own parameters
            let bth = document.getElementById("fecha").value;
            let campo = document.getElementById("nombre").value.split(' ');
            let dia = parseInt(bth.substring(8));
            let mes = parseInt(bth.substring(5, 7));

            let signo = "error";
            let nombre = "";

            for (fml in campo){//WTH???
                nombre += (campo[fml].substring(0,1).toUpperCase() + campo[fml].substring(1).toLowerCase() + ' ');
            }

            if ((mes == 1 && dia > 20) || (mes == 2 && dia < 19)) {
                signo = "acuario";
            }
            else if ((mes == 2 && dia > 18) || (mes == 3 && dia < 21)) {
                signo = "piscis";
            }
            else if ((mes == 3 && dia > 20) || (mes == 4 && dia < 21)) {
                signo = "aries";
            }
            else if ((mes == 4 && dia > 20) || (mes == 5 && dia < 22)) {
                signo = "tauro";
            }
            else if ((mes == 5 && dia > 21) || (mes == 6 && dia < 22)) {
                signo = "geminis";
            }
            else if ((mes == 6 && dia > 21) || (mes == 7 && dia < 23)) {
                signo = "cancer";
            }
            else if ((mes == 7 && dia > 22) || (mes == 8 && dia < 24)) {
                signo = "leo";
            }
            else if ((mes == 8 && dia > 23) || (mes == 9 && dia < 24)) {
                signo = "virgo";
            }
            else if ((mes == 9 && dia > 23) || (mes == 10 && dia < 24)) {
                signo = "libra";
            }
            else if ((mes == 10 && dia > 23) || (mes == 11 && dia < 23)) {
                signo = "escorpio";
            }
            else if ((mes == 11 && dia > 22) || (mes == 12 && dia < 22)) {
                signo = "sagitario";
            }
            else if ((mes == 12 && dia > 21) || (mes == 1 && dia < 21)) {
                signo = "capricornio";
            }

            // Output the result
            document.getElementById("display").textContent = "La fecha de nacimiento es: (" + bth + "). " + nombre.trimEnd() + ", tu signo es " + signo + "!";
        }

    </script>
</html>
