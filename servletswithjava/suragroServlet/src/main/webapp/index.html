<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SURAGRO | Sistema de Inventario</title>

    <!-- Google Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700&family=Oswald:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Material Symbols -->

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="sidebar-header">

            <div class="logo">

                <div class="logo-icon">

                    <span class="material-symbols-outlined">

                        science

                    </span>

                </div>

                <div class="logo-text">

                    <h1>SURAGRO</h1>

                    <p>Centralized Inventory</p>

                </div>

            </div>

        </div>

        <nav class="navigation"> 
            <form action="servletProductos" method="get">
                <button class="nav-item" type="submit">

                    <span class="material-symbols-outlined">

                        inventory_2

                    </span>

                    <span>Inventario</span>

                </button>
            </form>
        </nav>

        <div class="sidebar-footer">
            <button class="nav-item" data-page="login">
                <span class="material-symbols-outlined">

                    logout

                </span>

                <span>Cerrar sesión</span>

            </button>
        </div>
    </aside>


    <div class="workspace">
        <header class="topbar">
            <div class="page-info">
                <h2 id="page-title">

                    Dashboard

                </h2>

            </div>

            <div class="toolbar">
                <button class="icon-button">
                    <span class="material-symbols-outlined">

                        notifications

                    </span>

                </button>

                <button class="icon-button">
                    <span class="material-symbols-outlined">

                        account_circle

                    </span>

                </button>
            </div>
        </header>

        <main id="content" class="content">
            <section id="page-body">
                <!-- Dynamic page content -->
                <header class="page-header">
                <div>
                    <h2>

                        Bienvenido

                    </h2>

                    <p>

                        Seleccione una opción del menú lateral para comenzar.

                    </p>
                </div>
                </header>
            </section>
        </main>
    </div>
</div>

</body>
</html>
